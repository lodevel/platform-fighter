name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      # Compressed fighter sheets for the optional texture quality are git-ignored
      # and built here. The encoder output is deterministic and incremental, so the
      # cached bank only re-encodes sheets whose PNG changed.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy==2.4.6 pillow==12.2.0
      - uses: actions/cache@v4
        with:
          path: .tmp/basisu-src/bin
          key: basisu-${{ hashFiles('tools/build-basisu.sh') }}
      - run: tools/build-basisu.sh
      - uses: actions/cache@v4
        with:
          path: assets/characters/*/compressed
          key: compressed-sheets-${{ hashFiles('tools/encode-compressed-sheets.py', 'tools/build-basisu.sh', 'assets/characters/**/*.png') }}
          restore-keys: compressed-sheets-
      - run: npm run assets:compress

      - run: npm run assets:copy

      # Pages must be enabled manually once (Settings → Pages → Source:
      # GitHub Actions). The `enablement: true` shortcut needs admin
      # token permissions the default GITHUB_TOKEN lacks, so we don't
      # use it.
      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
